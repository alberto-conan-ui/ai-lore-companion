name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast tiers — type-check + every unit/integration test that does NOT need a
  # full Electron build. Runs on every push/PR. `--ignore-scripts` skips the
  # electron-rebuild postinstall (these tiers run on system node; core's own
  # test rebuilds better-sqlite3 against node as needed).
  fast:
    runs-on: ubuntu-latest
    # A required check with no timeout is a merge queue with no bottom. This
    # job ran for six hours before a person cancelled it, because one stale
    # assertion left a self-rescheduling timer alive and the test runner never
    # exited. `fast` takes about four minutes; fifteen is generous and still
    # fails in a tenth of the time it took to notice.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify (core build + node type-check + core/headless/component tests)
        run: npm run verify

  # End-to-end — heavier: a full Electron build driven by Playwright under a
  # virtual display. Separate stage so a slow or flaky e2e never blocks the fast
  # signal. NOTE: authored but not yet validated against a live runner — the
  # Electron + xvfb setup may need adjustment on its first run.
  e2e:
    runs-on: ubuntu-latest
    # Heavier than `fast` — a full Electron build under a virtual display —
    # but it has never taken more than about six minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build core (the app build resolves @ai-lore-companion/core from its dist)
        run: npm run build -w @ai-lore-companion/core
      # Creating a Space commits, and a bare runner has no git identity, so
      # `git commit` exits 128 with "Author identity unknown". A developer's
      # machine has one; the runner is given one here.
      - name: A git identity, which creating a Space needs to commit
        run: |
          git config --global user.email "ci@ai-lore.invalid"
          git config --global user.name "AI-Lore CI"
      - name: e2e (Playwright + Electron under xvfb)
        run: xvfb-run --auto-servernum npm run e2e
      # `trace: 'retain-on-failure'` writes a trace per failed test. Without this
      # step they stay on the runner and a failure cannot be read without running
      # the job again.
      - name: Playwright traces of the failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: packages/app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The Plans band's end-to-end guard (ai-lore#398): the real service, the real plans.py over a fake host, the real hook timer
  # and the real dashboard script. The tool lives in the ai-lore repository, which is PRIVATE, so the default token of this
  # repository cannot read it: the job needs a read-only token for it in the secret AI_LORE_READ_TOKEN. Without the secret the
  # job says so in a warning and does not run the test (a fork's pull request has no secrets either); with it the test runs
  # with AI_LORE_SPACE set, which makes it FAIL rather than skip when the tools are absent.
  plans-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_LORE_READ_TOKEN: ${{ secrets.AI_LORE_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Is the ai-lore repository readable here?
        id: lore
        run: |
          if [ -z "$AI_LORE_READ_TOKEN" ]; then
            echo "::warning title=plans-e2e not run::the secret AI_LORE_READ_TOKEN is not set (or this is a fork), and alberto-conan-ui/ai-lore is private, so the Plans band's end-to-end test could not be run"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.lore.outputs.have == 'true'
        with:
          repository: alberto-conan-ui/ai-lore
          ref: main
          token: ${{ secrets.AI_LORE_READ_TOKEN }}
          path: ai-lore
      - uses: actions/setup-node@v4
        if: steps.lore.outputs.have == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.lore.outputs.have == 'true'
        run: npm ci --ignore-scripts
      - if: steps.lore.outputs.have == 'true'
        run: npm run build -w @ai-lore-companion/core
      - name: plans-e2e (AI_LORE_SPACE is set, so a Space without the tools fails it)
        if: steps.lore.outputs.have == 'true'
        working-directory: packages/app
        env:
          AI_LORE_SPACE: ${{ github.workspace }}/ai-lore
        run: npx vitest run test/component/space/plans-e2e.test.tsx
