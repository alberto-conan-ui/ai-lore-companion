<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>AI-Lore</title>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; background: #0a0f17; }
      *, *::before, *::after { box-sizing: border-box; }
      /* Nerd Font — supplies powerline / glyph symbols missing from the system
         monospace; used as a fallback in the terminal font stack. */
      @font-face {
        font-family: 'Symbols Nerd Font Mono';
        src: url('./fonts/SymbolsNerdFontMono-Regular.ttf') format('truetype');
        font-display: swap;
      }
    </style>
  </head>

    <div id="root"></div>

  </body>
